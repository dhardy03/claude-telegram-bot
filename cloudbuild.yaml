steps:
  # Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/claude-telegram-bot:latest'
      - '-t'
      - 'gcr.io/$PROJECT_ID/claude-telegram-bot:$COMMIT_SHA'
      - '.'

  # Push the image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/claude-telegram-bot'

  # Deploy to Cloud Run
  - name: 'gcr.io/cloud-builders/gke-deploy'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'claude-telegram-bot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/claude-telegram-bot:latest'
      - '--region'
      - 'europe-west2'
      - '--no-allow-unauthenticated'
      - '--set-env-vars'
      - 'TELEGRAM_TOKEN=${_TELEGRAM_TOKEN},ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY},WEBHOOK_URL=${_WEBHOOK_URL}'
      - '--platform'
      - 'managed'

images:
  - 'gcr.io/$PROJECT_ID/claude-telegram-bot'

substitutions:
  _TELEGRAM_TOKEN: ''
  _ANTHROPIC_API_KEY: ''
  _WEBHOOK_URL: ''
